# This file is part of the minos-desktop-settings package
#
# Closing the lid does not suspend the machine. logind reads this after Ubuntu's /etc/systemd/logind.conf,
# which stays as Ubuntu ships it; see logind.conf(5). dpkg-reconfigure minos-desktop-settings, without the
# logind-ignore-lid module, takes it away again.

[Login]
HandleLidSwitch=ignore
