# This file is part of the minos-desktop-settings package
#
# systemd-resolved asks connman's DNS proxy, which knows the name servers of the network connman manages;
# /etc/resolv.conf stays Ubuntu's link to resolved. See resolved.conf(5). dpkg-reconfigure
# minos-desktop-settings, without the connman module, takes it away again.

[Resolve]
DNS=127.0.0.1
