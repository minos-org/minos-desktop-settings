# This file is part of the minos-desktop-settings package
#
# GRUB reads this file after /etc/default/grub (update-grub). Plymouth shows minos' boot animation only when
# the kernel's command line says "splash", and Ubuntu's server installer leaves the default options empty:
# "quiet splash" goes after whatever the files read before this one say, each word once.
# dpkg-reconfigure minos-desktop-settings, without the splash module, takes it away again.

for _minos_splash__word in quiet splash; do
    case " ${GRUB_CMDLINE_LINUX_DEFAULT} " in
        *" ${_minos_splash__word} "*) : ;;
        *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+${GRUB_CMDLINE_LINUX_DEFAULT} }${_minos_splash__word}" ;;
    esac
done
unset _minos_splash__word
